name: Android QA Build & Upload to Azure

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.6'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set ENV for QA
        id: detect
        run: |
          echo "ENV=qa" >> $GITHUB_OUTPUT
          echo "DEST_DIR=qa" >> $GITHUB_OUTPUT
          echo "BRANCH=qa" >> $GITHUB_OUTPUT

      - name: Select QA config
        run: |
          cp lib/config/qa_config.dart lib/config/app_config.dart
          echo "Using QA config"

      - name: Cache Flutter packages
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
   
      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-androidsdk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read App Version
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml || true)
          if [[ -z "$VERSION_LINE" ]]; then APP_VERSION="0.0.0"; else APP_VERSION=$(echo "$VERSION_LINE" | awk '{print $2}'); fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK info
        id: prep
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          APP_VERSION="${{ steps.version.outputs.APP_VERSION }}"
          APK_NAME="demo-app-qa-${APP_VERSION}-${TIMESTAMP}.apk"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
          DOWNLOAD_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_CONTAINER }}/${{ secrets.AZURE_DIRECTORY }}/qa/${APK_NAME}?${{ secrets.AZURE_SAS_TOKEN_READONLY }}"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Upload APK to Azure
        run: |
          BLOB_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_CONTAINER }}/${{ secrets.AZURE_DIRECTORY }}/qa/${{ steps.prep.outputs.APK_NAME }}?${{ secrets.AZURE_UPLOAD_SAS_TOKEN }}"
          curl -sS -X PUT "$BLOB_URL" \
            --data-binary "@build/app/outputs/flutter-apk/app-release.apk" \
            -H "x-ms-blob-type: BlockBlob" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --fail-with-body

      - name: Send Email (QA recipients)
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          QA_EMAIL_LIST: ${{ secrets.QA_EMAIL_LIST }}
        run: |
          python3 << 'EOF'
          import smtplib
          from email.mime.text import MIMEText

          sender = "${{ env.EMAIL_USERNAME }}"
          password = "${{ env.EMAIL_APP_PASSWORD }}"
          receivers = [e.strip() for e in "${{ env.QA_EMAIL_LIST }}".split(",")]

          app_version = "${{ steps.version.outputs.APP_VERSION }}"
          apk_name = "${{ steps.prep.outputs.APK_NAME }}"
          download_url = "${{ steps.prep.outputs.DOWNLOAD_URL }}"

          subject = f"QA APK Uploaded - Version {app_version}"

          body = """
          <html>
          <body>
              <p>Hello Team,<br><br>
              QA APK build completed.<br><br>

              <b>Version:</b> {}<br>
              <b>File:</b> {}<br><br>

              <b>Download APK:</b><br>
              <a href="{}">Click here to download</a><br><br>

              Regards,<br>
              CI/CD Pipeline<br>
              </p>
          </body>
          </html>
          """.format(app_version, apk_name, download_url)

          msg = MIMEText(body, "html")
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg["Subject"] = subject

          server = smtplib.SMTP("${{ env.SMTP_SERVER }}", int("${{ env.SMTP_PORT }}"))
          server.starttls()
          server.login(sender, password)
          server.sendmail(sender, receivers, msg.as_string())
          server.quit()
          EOF
